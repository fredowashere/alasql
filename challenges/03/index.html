    <script>
        alasql(`

INSERT INTO scholarships VALUES (1,12000), (2,18000), (3,24000), (4,15000), (5,21000), (6,13000);
`);

SELECT id, scholarship / 12 as scholarship FROM scholarships;
`);

                "id": 1,
                "scholarship": 1000
            },
            {
                "id": 2,

            },

            {

            },
            {
                "id": 6,
                "scholarship": 1083.3333333333333
            }
        ];
        
        console.log({ received, expected });
        console.log(deepCompare(received, expected) ? 'OK' : 'FAIL');
